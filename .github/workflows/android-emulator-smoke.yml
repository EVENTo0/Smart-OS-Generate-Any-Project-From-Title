name: Android Emulator Smoke
on: [pull_request]
jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install root dependencies
        run: npm install
      - name: Generate Snake web implementation
        run: npx tsx scripts/generate-snake-ci.ts
      - name: Create Capacitor Android wrapper
        run: |
          rm -rf .ci-native/snake-capacitor
          mkdir -p .ci-native/snake-capacitor/www
          cp -R .ci-workspaces/snake-game/build/. .ci-native/snake-capacitor/www/
          cd .ci-native/snake-capacitor
          npm init -y
          npm install --save-exact @capacitor/core@8.4.2 @capacitor/cli@8.4.2 @capacitor/android@8.4.2
          node -e "require('fs').writeFileSync('capacitor.config.json', JSON.stringify({appId:'ai.smartos.snake',appName:'SMART OS Snake',webDir:'www'}, null, 2))"
          npx cap add android
      - name: Build debug APK
        run: |
          cd .ci-native/snake-capacitor/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch Snake on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p .ci-evidence
            adb install -r .ci-native/snake-capacitor/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n ai.smartos.snake/.MainActivity
            sleep 3
            adb shell pidof ai.smartos.snake
            adb shell dumpsys activity activities | grep -m1 'mResumedActivity.*ai.smartos.snake'
            adb exec-out screencap -p > .ci-evidence/snake-android-emulator.png
      - name: Publish emulator evidence
        uses: actions/upload-artifact@v4
        with:
          name: snake-android-emulator-evidence
          path: .ci-evidence/snake-android-emulator.png
          if-no-files-found: error
