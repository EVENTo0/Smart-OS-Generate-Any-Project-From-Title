name: MVP
on: [pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Materialize generated Snake workspace
        run: npx tsx scripts/generate-snake-ci.ts
      - name: Controlled Snake web build check
        run: node --check .ci-workspaces/snake-game/build/src/main.js
      - name: Install Chromium runtime verifier
        run: |
          npm install --no-save @playwright/test@1.54.2
          npx playwright install chromium
      - name: Verify generated Snake in Chromium
        run: npx playwright test tests/runtime/snake-runtime.spec.ts --reporter=line
      - name: Publish generated Snake build
        uses: actions/upload-artifact@v4
        with:
          name: snake-generated-web-build
          path: .ci-workspaces/snake-game/build
          if-no-files-found: error
