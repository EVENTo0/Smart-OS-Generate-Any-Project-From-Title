name: MVP
on: [pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Materialize generated Snake workspace
        run: npx tsx scripts/generate-snake-ci.ts
      - name: Controlled Snake web build check
        run: node --check .ci-workspaces/snake-game/build/src/main.js
