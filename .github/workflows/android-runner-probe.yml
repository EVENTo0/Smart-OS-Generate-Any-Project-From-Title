name: Android Runner Probe
on: [workflow_dispatch]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Android build toolchain
        run: |
          test -n "$ANDROID_HOME"
          test -x "$ANDROID_HOME/platform-tools/adb"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)"
          test -n "$SDKMANAGER"
      - name: Record Android runner capability
        run: |
          mkdir -p .ci-evidence
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)"
          AVDMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/avdmanager' | head -n 1)"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          BUILD_READY=true
          EMULATOR_READY=true
          test -n "$AVDMANAGER" || EMULATOR_READY=false
          test -x "$EMULATOR" || EMULATOR_READY=false
          printf '{"platform":"android","hostPlatform":"linux","buildReady":%s,"emulatorReady":%s,"sdkmanager":"%s","adb":"%s"}\n' "$BUILD_READY" "$EMULATOR_READY" "$SDKMANAGER" "$ANDROID_HOME/platform-tools/adb" > .ci-evidence/android-runner.json
      - name: Publish Android runner evidence
        uses: actions/upload-artifact@v4
        with:
          name: android-runner-evidence
          path: .ci-evidence/android-runner.json
          if-no-files-found: error
