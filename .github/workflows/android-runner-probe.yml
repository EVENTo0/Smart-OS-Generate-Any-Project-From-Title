name: Android Runner Probe
on: [pull_request]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Android SDK environment
        run: |
          test -n "$ANDROID_HOME"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/emulator/emulator"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)"
          AVDMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/avdmanager' | head -n 1)"
          test -n "$SDKMANAGER"
          test -n "$AVDMANAGER"
      - name: Record Android runner capability
        run: |
          mkdir -p .ci-evidence
          printf '%s\n' '{"platform":"android","hostPlatform":"linux","tools":["sdkmanager","adb","emulator","avdmanager"],"status":"ready-for-packaging-probe"}' > .ci-evidence/android-runner.json
      - name: Publish Android runner evidence
        uses: actions/upload-artifact@v4
        with:
          name: android-runner-evidence
          path: .ci-evidence/android-runner.json
          if-no-files-found: error
