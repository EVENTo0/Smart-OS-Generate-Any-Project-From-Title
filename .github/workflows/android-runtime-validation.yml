name: Android Runtime Validation
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/generate-snake-ci.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-runtime-validation.yml'
concurrency:
  group: android-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install root dependencies
        run: npm install
      - name: Generate Snake web implementation
        run: npx tsx scripts/generate-snake-ci.ts
      - name: Create and build Capacitor Android wrapper
        run: |
          rm -rf .ci-native/snake-capacitor
          mkdir -p .ci-native/snake-capacitor/www
          cp -R .ci-workspaces/snake-game/build/. .ci-native/snake-capacitor/www/
          cd .ci-native/snake-capacitor
          npm init -y
          npm install --save-exact @capacitor/core@8.4.2 @capacitor/cli@8.4.2 @capacitor/android@8.4.2
          node -e "require('fs').writeFileSync('capacitor.config.json', JSON.stringify({appId:'ai.smartos.snake',appName:'SMART OS Snake',webDir:'www'}, null, 2))"
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publish Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: snake-android-debug-apk
          path: .ci-native/snake-capacitor/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Install and launch on Android 16 emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu software -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p .ci-evidence/android-runtime
            adb shell input keyevent 224 || true
            adb install -r .ci-native/snake-capacitor/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n ai.smartos.snake/.MainActivity | tee .ci-evidence/android-runtime/launch.txt
            sleep 3
            adb shell pidof ai.smartos.snake | tee .ci-evidence/android-runtime/pid.txt
            adb shell dumpsys activity top > .ci-evidence/android-runtime/activity-before.txt
            grep -q 'ai.smartos.snake' .ci-evidence/android-runtime/activity-before.txt
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml .ci-evidence/android-runtime/window.xml
            grep -q 'android.webkit.WebView' .ci-evidence/android-runtime/window.xml
            adb exec-out screencap -p > .ci-evidence/android-runtime/screenshot-before.png
            adb shell input swipe 800 1200 300 1200 250
            sleep 2
            adb shell dumpsys activity top > .ci-evidence/android-runtime/activity-after.txt
            grep -q 'ai.smartos.snake' .ci-evidence/android-runtime/activity-after.txt
            adb exec-out screencap -p > .ci-evidence/android-runtime/screenshot-after.png
            adb logcat -d -t 1200 > .ci-evidence/android-runtime/logcat.txt
            if grep -E 'FATAL EXCEPTION|Process: ai.smartos.snake.*FATAL' .ci-evidence/android-runtime/logcat.txt; then exit 1; fi
      - name: Publish Android runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snake-android-runtime-evidence
          path: .ci-evidence/android-runtime
          if-no-files-found: error
