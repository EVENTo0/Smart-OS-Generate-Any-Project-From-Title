name: Android APK Build
on: [pull_request]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install root dependencies
        run: npm install
      - name: Generate Snake web implementation
        run: npx tsx scripts/generate-snake-ci.ts
      - name: Create Capacitor Android wrapper
        run: |
          rm -rf .ci-native/snake-capacitor
          mkdir -p .ci-native/snake-capacitor/www
          cp -R .ci-workspaces/snake-game/build/. .ci-native/snake-capacitor/www/
          cd .ci-native/snake-capacitor
          npm init -y
          npm install --save-exact @capacitor/core@8.4.2 @capacitor/cli@8.4.2 @capacitor/android@8.4.2
          node -e "require('fs').writeFileSync('capacitor.config.json', JSON.stringify({appId:'ai.smartos.snake',appName:'SMART OS Snake',webDir:'www'}, null, 2))"
          npx cap add android
      - name: Build debug APK
        run: |
          cd .ci-native/snake-capacitor/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: snake-android-debug-apk
          path: .ci-native/snake-capacitor/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
